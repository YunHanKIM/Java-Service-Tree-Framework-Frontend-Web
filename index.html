<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 · 지원노트</title>
  <meta name="description" content="AI 채용공고 분석 · 이력서 비교 · 지원 관리를 한 곳에서 — 지원노트">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <aside class="app-sidebar d-none d-lg-flex flex-column">
      <a class="app-sidebar-brand" href="index.html">
        <span class="app-sidebar-brand-mark">지</span>
        지원노트
      </a>
      <nav class="flex-grow-1">
        <div class="nav-section-label">메뉴</div>
        <a class="nav-item" data-page="dashboard" href="index.html"><i class="bi bi-house"></i> 대시보드</a>
        <a class="nav-item" data-page="analyze" href="pages/analyze.html"><i class="bi bi-file-earmark-text"></i> 공고 분석</a>
        <a class="nav-item" data-page="applications" href="pages/applications.html"><i class="bi bi-kanban"></i> 지원 관리</a>
        <a class="nav-item" data-page="interview" href="pages/interview.html"><i class="bi bi-chat-square-text"></i> 면접 준비</a>
      </nav>
      <div class="app-sidebar-footer">
        <div class="d-flex align-items-center gap-2 px-2 py-2">
          <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:32px;height:32px;font-size:13px;font-weight:700;background:var(--color-accent-soft);color:var(--color-accent);" data-current-user-initial>?</div>
          <div class="flex-grow-1" style="min-width:0;">
            <div class="fw-semibold small text-truncate" data-current-user-name>게스트</div>
            <div class="text-faint" style="font-size:11px;">좋은 기회를 향한 여정</div>
          </div>
        </div>
        <button type="button" class="btn btn-sm btn-light w-100 mt-1" data-action="logout" data-home-path="pages/login.html">
          <i class="bi bi-box-arrow-right"></i> 로그아웃
        </button>
      </div>
    </aside>

    <div class="offcanvas offcanvas-start d-lg-none" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mobileSidebarLabel">지원노트</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="닫기"></button>
      </div>
      <div class="offcanvas-body p-2 pt-0">
        <a class="nav-item" data-page="dashboard" href="index.html"><i class="bi bi-house"></i> 대시보드</a>
        <a class="nav-item" data-page="analyze" href="pages/analyze.html"><i class="bi bi-file-earmark-text"></i> 공고 분석</a>
        <a class="nav-item" data-page="applications" href="pages/applications.html"><i class="bi bi-kanban"></i> 지원 관리</a>
        <a class="nav-item" data-page="interview" href="pages/interview.html"><i class="bi bi-chat-square-text"></i> 면접 준비</a>
        <hr>
        <button type="button" class="btn btn-sm btn-light w-100" data-action="logout" data-home-path="pages/login.html">
          <i class="bi bi-box-arrow-right"></i> 로그아웃
        </button>
      </div>
    </div>

    <div class="app-main">
      <header class="app-topbar">
        <button type="button" class="btn btn-sm btn-light d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-label="메뉴 열기">
          <i class="bi bi-list"></i>
        </button>
        <div class="flex-grow-1">
          <h1 class="h5 mb-0">대시보드</h1>
          <p class="text-muted-2 small mb-0 d-none d-sm-block">오늘의 노력이 더 나은 기회를 만듭니다.</p>
        </div>
        <a href="pages/analyze.html" class="btn btn-primary btn-sm">
          <i class="bi bi-plus-lg"></i> 새 공고 분석
        </a>
      </header>

      <main class="app-content">
        <section class="row g-3 mb-4" aria-label="주요 지표">
          <div class="col-6 col-lg-3">
            <div class="stat-tile">
              <div class="stat-tile-label">전체 등록 공고</div>
              <div class="stat-tile-value" id="statTotalPostings">0</div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="stat-tile">
              <div class="stat-tile-label">진행 중인 지원</div>
              <div class="stat-tile-value" id="statInProgress">0</div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="stat-tile">
              <div class="stat-tile-label">마감 7일 이내</div>
              <div class="stat-tile-value" id="statDeadlineSoon">0</div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="stat-tile">
              <div class="stat-tile-label">면접·결과 단계</div>
              <div class="stat-tile-value" id="statAdvanced">0</div>
            </div>
          </div>
        </section>

        <div class="row g-3">
          <div class="col-lg-5">
            <div class="card-surface p-4 h-100">
              <h2 class="h6 mb-3">지원 파이프라인</h2>
              <div id="funnelChart" role="img" aria-label="지원 단계별 건수"></div>
            </div>
          </div>

          <div class="col-lg-7">
            <div class="card-surface p-4 h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h6 mb-0">마감 임박 공고</h2>
                <a href="pages/applications.html" class="small">전체 보기</a>
              </div>
              <div id="deadlineList"></div>
            </div>
          </div>
        </div>

        <div class="card-surface p-4 mt-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 mb-0">최근 등록한 공고</h2>
            <a href="pages/analyze.html" class="small">공고 분석하러 가기</a>
          </div>
          <div id="recentPostings"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/common/config.js"></script>
  <script src="assets/js/common/util.js"></script>
  <script src="assets/js/common/store.js"></script>
  <script src="assets/js/common/seed.js"></script>
  <script src="assets/js/common/mock-ai.js"></script>
  <script src="assets/js/common/auth.js"></script>
  <script src="assets/js/common/nav.js"></script>
  <script src="assets/js/common/ajax.js"></script>
  <script src="assets/js/pages/index.js"></script>
</body>
</html>
