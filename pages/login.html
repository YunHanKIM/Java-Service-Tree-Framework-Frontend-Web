<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · 지원노트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="login" class="d-flex align-items-center justify-content-center p-3" style="min-height:100vh; background:var(--color-bg-subtle);">
  <div class="card-surface p-4 p-md-5" style="max-width:400px; width:100%;">
    <div class="text-center mb-4">
      <div class="app-sidebar-brand-mark mx-auto mb-2">지</div>
      <h1 class="h4 mb-1">지원노트</h1>
      <p class="text-muted-2 small mb-0">AI 채용공고 분석 · 이력서 비교 · 지원 관리</p>
    </div>

    <div id="loginError" class="error-state mb-3 d-none" role="alert">
      <i class="bi bi-exclamation-circle"></i>
      <span id="loginErrorText"></span>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="loginEmail" class="form-label small fw-semibold">이메일</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
        <div class="invalid-feedback">올바른 이메일 형식을 입력해주세요.</div>
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label small fw-semibold">비밀번호</label>
        <input type="password" class="form-control" id="loginPassword" placeholder="8자 이상" minlength="8" autocomplete="current-password" required>
        <div class="invalid-feedback">비밀번호는 8자 이상이어야 해요.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>

    <div class="d-flex align-items-center gap-2 my-3">
      <hr class="flex-grow-1 my-0">
      <span class="text-faint small">또는</span>
      <hr class="flex-grow-1 my-0">
    </div>

    <button type="button" id="demoLoginBtn" class="btn btn-outline-primary w-100">
      <i class="bi bi-stars"></i> 데모 계정으로 체험하기
    </button>
    <p class="text-faint text-center small mt-3 mb-0">
      회원가입 절차 없이, 브라우저에만 저장되는 데모 세션으로 모든 기능을 체험할 수 있어요.
    </p>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/common/config.js"></script>
  <script src="../assets/js/common/util.js"></script>
  <script src="../assets/js/common/store.js"></script>
  <script src="../assets/js/common/auth.js"></script>
  <script src="../assets/js/common/ajax.js"></script>
  <script src="../assets/js/pages/login.js"></script>
</body>
</html>
